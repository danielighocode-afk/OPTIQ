name: Build Android debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Works whether the repo root is the project folder or its parent.
      - name: Find the app folder
        id: dir
        run: |
          if [ -f package.json ]; then echo "path=." >> "$GITHUB_OUTPUT"
          elif [ -f optiq/package.json ]; then echo "path=optiq" >> "$GITHUB_OUTPUT"
          else echo "package.json not found" && exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ steps.dir.outputs.path }}
        run: npm install --no-audit --no-fund

      - name: Build the web app
        working-directory: ${{ steps.dir.outputs.path }}
        run: npm run build

      - name: Create the Android project
        working-directory: ${{ steps.dir.outputs.path }}
        run: |
          [ -d android ] || npx cap add android

      - name: Generate app icon and splash screen
        working-directory: ${{ steps.dir.outputs.path }}
        run: npx capacitor-assets generate --android

      - name: Sync web build into Android
        working-directory: ${{ steps.dir.outputs.path }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ steps.dir.outputs.path }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: optiq-debug-apk
          path: ${{ steps.dir.outputs.path }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
